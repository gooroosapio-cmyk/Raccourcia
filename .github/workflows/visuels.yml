name: Visuels

# Depose les visuels avant/apres dans le stockage et enregistre leurs lignes.
#
# Separe du workflow Catalogue : celui-la parle a la base par psql, celui-ci
# au stockage de fichiers, qui est une autre interface et une autre cle. Les
# melanger donnerait un workflow qui demande plus de droits qu'il n'en faut
# pour la plupart de ses usages.
#
# Le declenchement est manuel et demande de taper le nom du projet. Un depot
# de visuels se decide, il ne se declenche pas parce qu'une branche a bouge.

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Taper "raccourcia" pour confirmer le depot des visuels'
        required: true
        type: string
      tache:
        description: 'Ce que fait ce declenchement'
        required: true
        default: depot
        type: choice
        options:
          - depot
          - inventaire
      releve:
        description: 'Releve a appliquer (tache « depot » uniquement)'
        required: true
        default: data/visuels/v5-avant-apres.json
        type: choice
        options:
          - data/visuels/v5-avant-apres.json

jobs:
  depot:
    name: Deposer les visuels
    if: inputs.tache == 'depot'
    runs-on: ubuntu-latest
    # `production` porte le secret et, si l'environnement est protege, une
    # validation humaine avant execution.
    environment: production

    steps:
      - name: Verifier la confirmation
        if: inputs.confirmation != 'raccourcia'
        run: |
          echo "Confirmation absente ou incorrecte : depot annule."
          exit 1

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verifier la cle
        # Ce qui est affiche ici ne revele jamais la cle : sa longueur, la
        # forme de son prefixe, et — pour une cle JWT — le role et le projet
        # qu'elle declare, qui sont lisibles par quiconque la detient deja.
        # C'est ce qui distingue « cle tronquee au copier-coller » de « cle
        # anon prise pour la cle de service » ou « cle d'un autre projet »,
        # sans quoi il ne reste qu'a deviner.
        env:
          CLE: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PROJET: jhqajkhovtcjklrjgwrx
        run: |
          if [ -z "${CLE:-}" ]; then
            echo "Le secret SUPABASE_SERVICE_ROLE_KEY est vide ou absent de l environnement production."
            echo
            echo "L ajouter dans Settings > Environments > production > Add secret,"
            echo "avec la valeur de la cle service_role du projet Supabase."
            exit 1
          fi

          echo "Longueur : ${#CLE} caracteres."

          case "$CLE" in
            *[[:space:]]*)
              echo "La cle contient une espace ou un retour a la ligne : le copier-coller a emporte autre chose."
              exit 1 ;;
          esac

          case "$CLE" in
            eyJ*)
              echo "Forme : jeton JWT classique."
              charge=$(printf '%s' "$CLE" | cut -d. -f2)
              # base64url, et le rembourrage saute souvent au decoupage.
              charge=$(printf '%s' "$charge" | tr '_-' '/+')
              while [ $(( ${#charge} % 4 )) -ne 0 ]; do charge="${charge}="; done
              clair=$(printf '%s' "$charge" | base64 -d 2>/dev/null || true)
              # Les espaces apres les deux-points sont tolerees : un jeton
              # reel est compact, mais un controle qui casse sur une espace
              # est un controle qui ment un jour ou l'autre.
              role=$(printf '%s' "$clair" | grep -o '"role"[[:space:]]*:[[:space:]]*"[^"]*"' | sed 's/.*"\([^"]*\)"$/\1/')
              ref=$(printf '%s' "$clair" | grep -o '"ref"[[:space:]]*:[[:space:]]*"[^"]*"' | sed 's/.*"\([^"]*\)"$/\1/')
              echo "Role declare : ${role:-illisible}"
              echo "Projet declare : ${ref:-illisible}"
              if [ -n "$role" ] && [ "$role" != "service_role" ]; then
                echo
                echo "Ce n est pas la cle de service : cette cle porte le role « $role »."
                echo "Dans Supabase, Project Settings > API > Project API keys, prendre la"
                echo "ligne service_role et non la ligne anon."
                exit 1
              fi
              if [ -n "$ref" ] && [ "$ref" != "$PROJET" ]; then
                echo
                echo "Cette cle appartient au projet « $ref », pas a « $PROJET »."
                exit 1
              fi ;;
            sb_secret_*)
              echo "Forme : cle secrete de nouvelle generation." ;;
            sb_publishable_*)
              echo "Cette cle est PUBLIABLE : elle n a pas le droit d ecrire un visuel."
              echo "Prendre la cle secrete, celle qui commence par sb_secret_."
              exit 1 ;;
            *)
              echo "Forme inattendue : ni jeton JWT, ni cle sb_secret_."
              echo "La valeur collee n est probablement pas une cle d API."
              exit 1 ;;
          esac

          echo "Cle plausible."

      - name: Verifier que les images sont la
        run: |
          if [ ! -d data/visuels/images ]; then
            echo "Le dossier data/visuels/images est absent."
            echo
            echo "Les images ne vivent pas dans le depot : elles y transitent le temps"
            echo "d un import, puis en sortent une fois deposees dans le stockage."
            echo "Pour un nouveau depot, les y remettre avant de relancer — le releve"
            echo "dit quels fichiers il attend, sous avant/ et apres/."
            exit 1
          fi
          echo "$(find data/visuels/images -type f | wc -l) fichiers presents."

      - name: Deposer les visuels
        env:
          # L URL du projet est publique : elle est servie dans chaque page du
          # site. Seule la cle est un secret.
          SUPABASE_URL: https://jhqajkhovtcjklrjgwrx.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/import-visuels.mjs "${{ inputs.releve }}" data/visuels/images

      - name: Etat apres depot
        env:
          SUPABASE_URL: https://jhqajkhovtcjklrjgwrx.supabase.co
          CLE: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          curl -s "$SUPABASE_URL/rest/v1/prompt_media?select=kind" \
            -H "apikey: $CLE" -H "Authorization: Bearer $CLE" \
            -H "Prefer: count=exact" -H "Range: 0-0" -o /dev/null -D - \
            | grep -i 'content-range' \
            | sed 's/^/  visuels en base : /'

  inventaire:
    name: Inventorier les visuels manquants
    if: inputs.tache == 'inventaire'
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Installer psql
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client

      # Lecture seule. Le resultat sort en CSV dans le journal : c'est la
      # seule facon de faire redescendre une liste d'ici, et une liste de
      # commandes n'a rien de confidentiel.
      - name: Commandes sans visuel
        env:
          PGURL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "${PGURL:-}" ]; then
            echo "Le secret SUPABASE_DB_URL est absent de l environnement production."
            exit 1
          fi
          echo '--- DEBUT CSV ---'
          psql "$PGURL" -v ON_ERROR_STOP=1 --csv -c "
            select
              coalesce(c.external_ref, '(sans famille)') as famille_ref,
              coalesce(c.name, '(sans famille)')         as famille,
              c.is_visible                               as famille_visible,
              p.command                                  as commande,
              p.name                                     as titre,
              p.mode                                     as domaine,
              p.status                                   as statut,
              p.is_free                                  as offert,
              coalesce(p.external_ref, '')               as reference,
              exists (select 1 from public.prompt_media m
                      where m.prompt_id = p.id and m.kind = 'before') as a_avant,
              exists (select 1 from public.prompt_media m
                      where m.prompt_id = p.id and m.kind = 'after')  as a_apres
            from public.prompts p
            left join public.categories c on c.id = p.category_id
            where p.status <> 'archived'
            order by coalesce(c.external_ref, 'zzz'), p.command;"
          echo '--- FIN CSV ---'
