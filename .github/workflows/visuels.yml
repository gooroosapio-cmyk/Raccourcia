name: Visuels

# Depose les visuels avant/apres dans le stockage et enregistre leurs lignes.
#
# Separe du workflow Catalogue : celui-la parle a la base par psql, celui-ci
# au stockage de fichiers, qui est une autre interface et une autre cle. Les
# melanger donnerait un workflow qui demande plus de droits qu'il n'en faut
# pour la plupart de ses usages.
#
# Le declenchement est manuel et demande de taper le nom du projet. Un depot
# de visuels se decide, il ne se declenche pas parce qu'une branche a bouge.

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Taper "raccourcia" pour confirmer une tache qui ecrit (depot, cache)'
        required: true
        type: string
      tache:
        description: 'Ce que fait ce declenchement'
        required: true
        default: depot
        type: choice
        options:
          - depot
          - inventaire
          - cache-apercu
          - cache
      releve:
        description: 'Releve a appliquer (tache « depot » uniquement)'
        required: true
        default: data/visuels/v5-avant-apres.json
        type: choice
        options:
          - data/visuels/v5-avant-apres.json

jobs:
  depot:
    name: Deposer les visuels
    if: inputs.tache == 'depot'
    runs-on: ubuntu-latest
    # `production` porte le secret et, si l'environnement est protege, une
    # validation humaine avant execution.
    environment: production

    steps:
      - name: Verifier la confirmation
        if: inputs.confirmation != 'raccourcia'
        run: |
          echo "Confirmation absente ou incorrecte : depot annule."
          exit 1

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verifier la cle
        uses: ./.github/actions/verifier-cle
        with:
          cle: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          projet: jhqajkhovtcjklrjgwrx

      - name: Verifier que les images sont la
        run: |
          if [ ! -d data/visuels/images ]; then
            echo "Le dossier data/visuels/images est absent."
            echo
            echo "Les images ne vivent pas dans le depot : elles y transitent le temps"
            echo "d un import, puis en sortent une fois deposees dans le stockage."
            echo "Pour un nouveau depot, les y remettre avant de relancer — le releve"
            echo "dit quels fichiers il attend, sous avant/ et apres/."
            exit 1
          fi
          echo "$(find data/visuels/images -type f | wc -l) fichiers presents."

      - name: Deposer les visuels
        env:
          # L URL du projet est publique : elle est servie dans chaque page du
          # site. Seule la cle est un secret.
          SUPABASE_URL: https://jhqajkhovtcjklrjgwrx.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/import-visuels.mjs "${{ inputs.releve }}" data/visuels/images

      # Le compte passait par l'interface REST avec un en-tete Range : elle a
      # rendu 740 la ou la base en portait plus de mille, et un controle qui
      # ment vaut moins que pas de controle. psql compte, lui, sans borne.
      - name: Etat apres depot
        env:
          PGURL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "${PGURL:-}" ]; then
            echo "SUPABASE_DB_URL absent : etat final non releve."
            exit 0
          fi
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
          psql "$PGURL" -v ON_ERROR_STOP=1 -At -c "
            select '  ' || count(*) || ' visuels en base, dont ' ||
                   count(*) filter (where kind = 'before') || ' avant et ' ||
                   count(*) filter (where kind = 'after')  || ' apres'
            from public.prompt_media;"
          psql "$PGURL" -v ON_ERROR_STOP=1 -At -c "
            select '  ' || count(*) || ' commandes actives, dont ' ||
                   count(*) filter (where exists (
                     select 1 from public.prompt_media m
                     where m.prompt_id = p.id and m.kind = 'after')) ||
                   ' servies et ' ||
                   count(*) filter (where not exists (
                     select 1 from public.prompt_media m
                     where m.prompt_id = p.id and m.kind = 'after')) ||
                   ' encore sans visuel'
            from public.prompts p where p.status <> 'archived';"

  cache:
    name: Reposer la duree de cache des visuels
    if: inputs.tache == 'cache' || inputs.tache == 'cache-apercu'
    runs-on: ubuntu-latest
    environment: production

    # Le script d'import a longtemps envoye les fichiers sans en-tete de
    # cache : le stockage les marque alors « no-cache », et le navigateur
    # retelecharge chaque vignette a chaque remontee dans la grille. Le
    # stockage ne sait pas changer cet en-tete sans qu'on lui renvoie les
    # octets — le script va donc les rechercher dans le stockage lui-meme et
    # les y repose, au meme chemin, octet pour octet.
    #
    # « cache-apercu » ne fait que lire et compter. Il n'ecrit rien et ne
    # demande donc pas de confirmation : c'est par lui qu'on commence.
    steps:
      - name: Verifier la confirmation
        if: inputs.tache == 'cache' && inputs.confirmation != 'raccourcia'
        run: |
          echo "Cette tache reecrit des objets du stockage."
          echo "Relancer en tapant « raccourcia » dans le premier champ."
          exit 1

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verifier la cle
        uses: ./.github/actions/verifier-cle
        with:
          cle: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          projet: jhqajkhovtcjklrjgwrx

      - name: Reposer les visuels
        env:
          SUPABASE_URL: https://jhqajkhovtcjklrjgwrx.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ "${{ inputs.tache }}" = "cache-apercu" ]; then
            node scripts/recache-visuels.mjs --apercu
          else
            node scripts/recache-visuels.mjs
          fi

  inventaire:
    name: Inventorier les visuels manquants
    if: inputs.tache == 'inventaire'
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Installer psql
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client

      # Lecture seule. Le resultat sort en CSV dans le journal : c'est la
      # seule facon de faire redescendre une liste d'ici, et une liste de
      # commandes n'a rien de confidentiel.
      - name: Commandes sans visuel
        env:
          PGURL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "${PGURL:-}" ]; then
            echo "Le secret SUPABASE_DB_URL est absent de l environnement production."
            exit 1
          fi
          echo '--- DEBUT CSV ---'
          psql "$PGURL" -v ON_ERROR_STOP=1 --csv -c "
            select
              coalesce(c.external_ref, '(sans famille)') as famille_ref,
              coalesce(c.name, '(sans famille)')         as famille,
              c.is_visible                               as famille_visible,
              p.command                                  as commande,
              p.name                                     as titre,
              p.mode                                     as domaine,
              p.status                                   as statut,
              p.is_free                                  as offert,
              coalesce(p.external_ref, '')               as reference,
              exists (select 1 from public.prompt_media m
                      where m.prompt_id = p.id and m.kind = 'before') as a_avant,
              exists (select 1 from public.prompt_media m
                      where m.prompt_id = p.id and m.kind = 'after')  as a_apres,
              -- La carte retombe sur un visuel de type « thumbnail » quand
              -- l'apres manque : une commande qui en porte un n'est pas nue.
              exists (select 1 from public.prompt_media m
                      where m.prompt_id = p.id and m.kind = 'thumbnail') as a_vignette,
              (select count(*) from public.prompt_media m
                      where m.prompt_id = p.id) as visuels_total
            from public.prompts p
            left join public.categories c on c.id = p.category_id
            where p.status <> 'archived'
            order by coalesce(c.external_ref, 'zzz'), p.command;"
          echo '--- FIN CSV ---'
