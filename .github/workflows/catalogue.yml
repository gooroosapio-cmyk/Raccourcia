name: Catalogue

# Applique le catalogue a une base Supabase, lot par lot, dans l'ordre.
#
# Ce n'est pas un deploiement automatique : le declenchement est manuel et
# demande de taper le nom de la base visee. Un catalogue s'importe quand on
# l'a decide, pas parce qu'une branche a bouge.
#
# Chaque lot porte son controle de completude : le premier qui n'atteint pas
# son compte leve, `ON_ERROR_STOP` arrete la serie, et rien ne passe en
# silence. C'est l'absence de ce controle qui avait laisse 99 raccourcis en
# arriere lors de l'import precedent.
#
# Le dossier de lots est un parametre : un catalogue plus recent n'efface pas
# le precedent, il s'importe a cote et reste rejouable.

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Taper "raccourcia" pour confirmer l import en production'
        required: true
        type: string
      bascule:
        description: 'Changer la navigation (taxonomie V5, refonte image V6) : taper "basculer". Laisser vide sinon.'
        required: false
        default: ''
        type: string
      dossier:
        description: 'Lots a appliquer'
        required: true
        default: supabase/seed/v5-lot-01
        type: choice
        options:
          - formats-et-rayons
          - catalogue-final
          - offre-2026-09
          - exploration-v4
          - fusion-2026-09
          - catalogue-2026-09
          - administration-v3
          - ecrans-v3
          - taxonomie-v3
          - actions-groupees
          - menage-taxonomie
          - kit-ui
          - moteur-v3
          - catalogue-v2
          - fermer-tables-sauvegarde
          - refonte-image-v6
          - supabase/seed/v6-payloads
          - supabase/seed/v5-2
          - supabase/seed/v5-1
          - bascule-seule
          - supabase/seed/v5
          - supabase/seed/v5-lot-01
          - supabase/seed/images-responsives
          - supabase/seed/catalogue-v3
          - supabase/seed/v3

jobs:
  import:
    name: Importer le catalogue
    runs-on: ubuntu-latest
    # `production` porte le secret et, si l'environnement est protege, une
    # validation humaine avant execution.
    environment: production

    steps:
      - name: Verifier la confirmation
        if: inputs.confirmation != 'raccourcia'
        run: |
          echo "Confirmation absente ou incorrecte : import annule."
          exit 1

      - uses: actions/checkout@v4

      - name: Installer psql
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client

      - name: Verifier que la base est joignable
        env:
          PGURL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          # La connexion directe de Supabase (db.<ref>.supabase.co) ne resout
          # qu'en IPv6. Les runners GitHub n'ont pas d'IPv6 : psql echoue sur
          # un « Network is unreachable » qui ne dit pas pourquoi. On le dit.
          if [ -z "${PGURL:-}" ]; then
            echo "Le secret SUPABASE_DB_URL est vide ou absent de l environnement production."
            exit 1
          fi
          if printf '%s' "$PGURL" | grep -q '@db\..*\.supabase\.co'; then
            echo "L URI pointe vers la connexion directe (db.<ref>.supabase.co), joignable"
            echo "en IPv6 uniquement. Les runners GitHub n ont pas d IPv6."
            echo
            echo "Remplacer le secret SUPABASE_DB_URL par l URI « Session pooler »,"
            echo "affichee dans Supabase > bouton Connect. Elle est en IPv4 et son"
            echo "hote se termine par .pooler.supabase.com."
            exit 1
          fi
          psql "$PGURL" -At -c 'select 1' > /dev/null
          echo "Base joignable."

      - name: Etat avant import
        env:
          PGURL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          psql "$PGURL" -At -c "
            select 'raccourcis=' || count(*) ||
                   ' publies=' || count(*) filter (where status = 'published')
            from public.prompts;"

      # Ce pas applique un dossier de lots tel quel. Les options qui ne sont
      # pas des chemins — « catalogue-v2 », « moteur-v3 », les bascules — ont
      # leur propre pas et doivent etre exclues ici, sinon `ls` cherche un
      # dossier qui n'existe pas et le job meurt avant d'atteindre le leur.
      #
      # Rejouer les 66 lots du catalogue V5 represente cinq megaoctets de SQL
      # pour un resultat qui, la deuxieme fois, ne change rien. « bascule-seule »
      # saute cette etape : la bascule est une dizaine d'instructions, elle n'a
      # pas besoin qu'on reimporte le catalogue pour s'executer.
      - name: Appliquer les lots
        if: >-
          inputs.dossier != 'bascule-seule' &&
          inputs.dossier != 'refonte-image-v6' &&
          inputs.dossier != 'fermer-tables-sauvegarde' &&
          inputs.dossier != 'catalogue-v2' &&
          inputs.dossier != 'moteur-v3' &&
          inputs.dossier != 'kit-ui' &&
          inputs.dossier != 'menage-taxonomie' &&
          inputs.dossier != 'actions-groupees' &&
          inputs.dossier != 'taxonomie-v3' &&
          inputs.dossier != 'ecrans-v3' &&
          inputs.dossier != 'administration-v3' &&
          inputs.dossier != 'catalogue-2026-09' &&
          inputs.dossier != 'fusion-2026-09' &&
          inputs.dossier != 'offre-2026-09' &&
          inputs.dossier != 'exploration-v4' &&
          inputs.dossier != 'catalogue-final' &&
          inputs.dossier != 'formats-et-rayons'
        env:
          PGURL: ${{ secrets.SUPABASE_DB_URL }}
          DOSSIER: ${{ inputs.dossier }}
        run: |
          set -euo pipefail
          total=$(ls "$DOSSIER"/*.sql | wc -l)
          n=0
          for fichier in "$DOSSIER"/*.sql; do
            n=$((n + 1))
            printf '  [%3d/%3d] %s\n' "$n" "$total" "$(basename "$fichier")"
            # Redirection plutot que -f : psql lit alors le fichier avec les
            # droits de l'appelant, pas ceux du compte postgres.
            psql "$PGURL" -v ON_ERROR_STOP=1 -q --no-psqlrc < "$fichier"
          done
          if [ "$DOSSIER" = "supabase/seed/v3" ]; then
            echo '  Bascule de navigation'
            psql "$PGURL" -v ON_ERROR_STOP=1 --no-psqlrc \
              < supabase/seed/bascule-navigation-v2.sql
          fi

      # La bascule de taxonomie est la seule etape que les membres voient :
      # quatorze familles s'ouvrent et les anciennes se ferment. Importer le
      # catalogue et changer la navigation sont deux decisions distinctes,
      # elles demandent donc deux mots differents. Sans le second, l'import
      # depose le contenu V5 dans la taxonomie actuelle et n'y touche pas.
      - name: Basculer la taxonomie V5
        if: >-
          inputs.bascule == 'basculer' &&
          (inputs.dossier == 'supabase/seed/v5' || inputs.dossier == 'bascule-seule')
        env:
          PGURL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          echo '  Bascule de taxonomie V5'
          psql "$PGURL" -v ON_ERROR_STOP=1 --no-psqlrc \
            < supabase/seed/bascule-taxonomie-v5.sql

      # Refonte V6 du domaine Image : six familles deviennent quatre.
      #
      # Quatre fichiers, dans cet ordre. La migration pose les trois familles en
      # brouillon — elle est idempotente, la rejouer ne cree rien. La bascule
      # les publie, deplace les commandes et archive ce qui se vide, le tout
      # dans une transaction avec ses controles de sortie : si le compte n'y
      # est pas, rien ne reste a moitie fait.
      #
      # Comme la bascule V5, elle demande le mot « basculer » : c'est la
      # navigation des membres qui change, pas seulement du contenu.
      - name: Refondre les familles image (V6)
        if: >-
          inputs.dossier == 'refonte-image-v6' &&
          inputs.bascule == 'basculer'
        env:
          PGURL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          echo '  Migration : les trois familles image'
          psql "$PGURL" -v ON_ERROR_STOP=1 --no-psqlrc \
            < supabase/migrations/20260913120000_refonte_familles_image.sql
          echo '  Migration : la famille architecture et lieux'
          psql "$PGURL" -v ON_ERROR_STOP=1 --no-psqlrc \
            < supabase/migrations/20260913170000_famille_architecture_image.sql
          echo '  Bascule : deplacement et archivage'
          psql "$PGURL" -v ON_ERROR_STOP=1 --no-psqlrc \
            < supabase/seed/bascule-image-v6.sql
          echo '  Bascule : le quatrieme rayon'
          psql "$PGURL" -v ON_ERROR_STOP=1 --no-psqlrc \
            < supabase/seed/bascule-image-v6-quatre.sql
          echo '  Etat du domaine image :'
          psql "$PGURL" -At -c "
            select '    ' || c.name || ' : ' || count(*) filter (where p.status = 'published') ||
                   ' commandes publiees'
            from public.categories c
            left join public.prompts p on p.category_id = c.id
            where c.mode = 'image' and c.is_visible and c.external_ref is not null
            group by c.name, c.sort_order order by c.sort_order;"

      # Un dossier choisi sans le mot « basculer » ne doit pas se terminer sur
      # un succes vert alors que rien n'a ete applique.
      - name: Refonte image demandee sans confirmation
        if: inputs.dossier == 'refonte-image-v6' && inputs.bascule != 'basculer'
        run: |
          echo "La refonte des familles image change la navigation des membres."
          echo "Relancer en tapant « basculer » dans le second champ."
          exit 1

      # Les tables de sauvegarde heritaient d'un SELECT anon et d'une ecriture
      # authenticated : `alter default privileges` les donne a toute table
      # creee dans `public`, et un `create table as` de seed ne pose aucune
      # policy pour les reprendre. Cette etape ferme les quatre.
      #
      # Aucune donnee n'est touchee, et la migration est idempotente : pas de
      # mot de confirmation supplementaire, la seule confirmation du workflow
      # suffit.
      - name: Fermer les tables de sauvegarde
        if: inputs.dossier == 'fermer-tables-sauvegarde'
        env:
          PGURL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          psql "$PGURL" -v ON_ERROR_STOP=1 --no-psqlrc \
            < supabase/migrations/20260915090000_fermer_les_tables_de_sauvegarde.sql
          echo '  Etat des sauvegardes :'
          psql "$PGURL" -At -c "
            select '    ' || c.relname || ' : RLS=' || c.relrowsecurity ||
                   ', droits navigateur=' ||
                   coalesce((select string_agg(distinct g.grantee, ',')
                             from information_schema.role_table_grants g
                             where g.table_schema = 'public' and g.table_name = c.relname
                               and g.grantee in ('anon','authenticated')), 'aucun')
            from pg_class c join pg_namespace n on n.oid = c.relnamespace
            where n.nspname = 'public' and c.relkind = 'r' and c.relname like '%avant%'
            order by c.relname;"

      # Refonte V2 : le catalogue de galerie remplace le precedent.
      #
      # Les migrations sont nommees une par une, et non ramassees par un
      # `ls` du dossier : ce workflow applique un lot precis a une base de
      # production, et parcourir tout `supabase/migrations` y appliquerait
      # aussi celles qu'une autre branche vient d'ajouter. La contrepartie
      # est qu'une migration oubliee ici ne part jamais — et rien ne le dit.
      # Toute migration dont le catalogue V2 depend doit donc etre ajoutee a
      # cette liste dans le meme changement qui la cree.
      #
      # Les migrations, les lots, puis la bascule. Les lots posent 692
      # cartes en brouillon et sans texte ; la bascule ouvre les rayons,
      # publie les 594 cartes que le classeur declare visibles, et archive
      # l'ancien catalogue. Rien n'est supprime.
      #
      # Comme la bascule de taxonomie, elle demande le mot « basculer » :
      # c'est tout ce que les membres voient qui change.
      - name: Refondre le catalogue (V2)
        if: inputs.dossier == 'catalogue-v2' && inputs.bascule == 'basculer'
        env:
          PGURL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          for fichier in \
            supabase/migrations/20260915120000_socle_catalogue_v2.sql \
            supabase/migrations/20260915130000_resolve_prompt_refuse_le_vide.sql \
            supabase/migrations/20260916090000_type_d_experience.sql \
            supabase/migrations/20260916140000_recherche_personnages_et_synonymes.sql; do
            echo "  Migration : $(basename "$fichier")"
            psql "$PGURL" -v ON_ERROR_STOP=1 -q --no-psqlrc < "$fichier"
          done
          total=$(ls supabase/seed/catalogue-v2/*.sql | wc -l)
          n=0
          for fichier in supabase/seed/catalogue-v2/*.sql; do
            n=$((n + 1))
            printf '  [%2d/%2d] %s\n' "$n" "$total" "$(basename "$fichier")"
            psql "$PGURL" -v ON_ERROR_STOP=1 -q --no-psqlrc < "$fichier"
          done
          echo '  Bascule du catalogue'
          psql "$PGURL" -v ON_ERROR_STOP=1 --no-psqlrc < supabase/seed/bascule-catalogue-v2.sql
          echo '  Etat du catalogue :'
          psql "$PGURL" -At -c "
            select '    ' || count(*) filter (where status = 'published') || ' cartes publiees, ' ||
                   count(*) filter (where status = 'draft') || ' en brouillon, ' ||
                   count(*) filter (where payload_ready) || ' avec un texte a copier'
            from public.prompts where catalog_v2;"
          psql "$PGURL" -At -c "
            select '    ' || c.name || ' : ' || count(*) filter (where p.status = 'published') || ' cartes'
            from public.categories c
            left join public.categories f on f.parent_id = c.id
            left join public.prompts p on p.category_id = f.id
            where c.external_ref like 'V2-CAT-%' and c.is_visible
            group by c.name, c.sort_order order by c.sort_order;"

      # Moteur V3 : la matiere que le catalogue V2 n'avait pas.
      #
      # Les cartes etaient arrivees sans variantes, donc sans version, donc
      # sans texte a copier : 615 commandes publiees et inutilisables. Ce lot
      # pose les trois variantes, les 2 076 payloads et les sept champs du
      # moteur.
      #
      # Il ne touche ni titre, ni categorie, ni collection : le classeur porte
      # encore la taxonomie d'avant le rangement des rayons, et l'ecrire
      # deferait ce qui a ete valide depuis. L'appariement se fait sur
      # `card_id`.
      #
      # Comme les autres bascules, il demande le mot « basculer » : ce que les
      # membres peuvent copier change.
      - name: Appliquer le moteur (V3)
        if: inputs.dossier == 'moteur-v3' && inputs.bascule == 'basculer'
        env:
          PGURL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          echo '  Migration : les champs du moteur'
          psql "$PGURL" -v ON_ERROR_STOP=1 -q --no-psqlrc \
            < supabase/migrations/20260916180000_moteur_v3.sql
          total=$(ls supabase/seed/moteur-v3/*.sql | wc -l)
          n=0
          for fichier in supabase/seed/moteur-v3/*.sql; do
            n=$((n + 1))
            printf '  [%2d/%2d] %s\n' "$n" "$total" "$(basename "$fichier")"
            psql "$PGURL" -v ON_ERROR_STOP=1 -q --no-psqlrc < "$fichier"
          done
          echo '  Etat du moteur :'
          psql "$PGURL" -At -c "
            select '    ' || count(*) filter (where payload_ready) || ' cartes avec un texte a copier sur ' ||
                   count(*) || ' cartes du catalogue'
            from public.prompts where catalog_v2;"
          psql "$PGURL" -At -c "
            select '    ' || count(*) || ' payloads courants du moteur V3'
            from public.prompt_versions where version_label = 'moteur-v3' and is_current;"

      # Les descriptions des rayons, generees depuis le kit UI.
      #
      # Le lot n'est fait que d'affectations : aucune ligne creee, aucune
      # supprimee, aucune carte touchee. Un rayon absent de la base ne fait
      # rien. Il est donc rejouable sans precaution, et ne demande pas le mot
      # « basculer » — ce que les membres peuvent copier ne change pas, seule
      # la phrase sous la tuile change.
      - name: Appliquer les descriptions des rayons (kit UI)
        if: inputs.dossier == 'kit-ui'
        env:
          PGURL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          for fichier in supabase/seed/kit-ui/*.sql; do
            echo "  $(basename "$fichier")"
            psql "$PGURL" -v ON_ERROR_STOP=1 -q --no-psqlrc < "$fichier"
          done
          echo '  Etat des rayons :'
          psql "$PGURL" -At -c "
            select '    ' || count(*) filter (where coalesce(short_description, '') <> '') ||
                   ' rayons decrits sur ' || count(*) || ' ouverts'
            from public.categories where is_visible and external_ref like 'V2-%';"

      # Le socle V3 : tags relationnels, likes, champs personnalisables.
      #
      # La migration cree les tables et leurs politiques ; les lots creent la
      # taxonomie et posent les tags que la base sait justifier — bibliotheque
      # et IA declarees. Aucun tag de style ou de contexte n'est attribue : on
      # ne les deduit pas d'un nom de commande.
      #
      # Rien de ce que les membres voient ne change tant qu'aucun ecran ne lit
      # ces tables. Le mot « basculer » n'a donc pas de sens ici.
      - name: Installer le socle V3 (tags, likes, champs)
        if: inputs.dossier == 'taxonomie-v3'
        env:
          PGURL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          echo '  Migration : tags, likes, champs personnalisables'
          psql "$PGURL" -v ON_ERROR_STOP=1 -q --no-psqlrc \
            < supabase/migrations/20260919090000_tags_likes_et_champs.sql
          for fichier in supabase/seed/taxonomie-v3/*.sql; do
            echo "  $(basename "$fichier")"
            psql "$PGURL" -v ON_ERROR_STOP=1 -q --no-psqlrc < "$fichier"
          done
          echo '  Etat de la taxonomie :'
          psql "$PGURL" -At -c "
            select '    ' || (select count(*) from public.tags) || ' tags, ' ||
                   (select count(*) from public.prompt_tags) || ' associations, ' ||
                   (select count(*) from public.prompts
                    where status = 'published' and library is null) ||
                   ' commande(s) publiee(s) sans bibliotheque';"

      # Le sommaire d'une bibliotheque : ses collections et ses tags.
      #
      # Toucher « Images » rendait mille cartes a la suite. Ces deux
      # fonctions rendent de quoi se reperer : les collections et les tags
      # de la bibliotheque, deja comptes et deja illustres.
      #
      # `security invoker`, donc lecture a travers les politiques du
      # Ce que rend chaque commande, et ce que contient chaque rayon.
      #
      # TROIS CORRECTIONS DANS UN SEUL LOT.
      #
      # 1. « VOUS OBTENEZ » DISAIT FAUX. `output_formats` n'est jamais
      #    vide : un declencheur le remplit a l'insertion depuis
      #    `output_type`, que l'import ne renseigne pas. Les 1 595 cartes
      #    avaient donc recu « texte » — y compris les 1 242 commandes
      #    image, qui annoncaient « 1 texte ». Le lot remplace cette seule
      #    valeur par defaut, jamais une valeur choisie.
      #
      # 2. AUCUN TAG NE DISAIT LE FORMAT RENDU. Douze tags `sortie-*`
      #    dans le groupe « Ce que vous obtenez » : conversation, PDF,
      #    CSV, tableur, presentation, e-mail... On peut enfin chercher
      #    un outil et pas seulement un sujet.
      #
      # 3. LES RAYONS DE TEXTES NE MONTRAIENT RIEN. Trente descriptions
      #    ecrites a la main. Un rayon d'Images emprunte le visuel d'une
      #    de ses commandes ; « Synthese » n'a rien a emprunter.
      #
      # Rejouable : upserts et mises a jour bornees, verifie deux fois de
      # suite sur une base montee de zero.
      - name: Poser les formats de sortie et decrire les rayons
        if: inputs.dossier == 'formats-et-rayons'
        env:
          PGURL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          for fichier in supabase/seed/formats-et-rayons/*.sql; do
            # Les « j'aime » de depart sont des donnees de presentation :
            # elles attendent « basculer », comme toute mise en vitrine.
            case "$fichier" in *900_jaime_de_depart.sql) continue;; esac
            printf '  %s\n' "$(basename "$fichier")"
            psql "$PGURL" -v ON_ERROR_STOP=1 -q --no-psqlrc < "$fichier"
          done
          echo '  Ce que le catalogue annonce rendre :'
          psql "$PGURL" -At -c "
            select '    ' || f || ' : ' || n || ' carte(s)' from (
              select f::text as f, count(*) as n
              from public.prompts p, unnest(p.output_formats) f
              where p.status = 'published' and p.card_id is not null
              group by 1 order by 2 desc) x;"

      # Des « j'aime » de depart — DES DONNEES DE PRESENTATION, PAS DES
      # MESURES. Aucune ligne n'existe en face dans `prompt_likes` : ces
      # chiffres ne comptent personne. A remettre a zero avant
      # l'ouverture du service, c'est le point 0 de la check-list.
      - name: Poser des « j'aime » de depart
        if: inputs.dossier == 'formats-et-rayons' && inputs.bascule == 'basculer'
        env:
          PGURL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          psql "$PGURL" -v ON_ERROR_STOP=1 --no-psqlrc \
            < supabase/seed/formats-et-rayons/900_jaime_de_depart.sql

      # Le catalogue final : 1 595 cartes, 624 commandes.
      #
      # C'est le meme referentiel que `catalogue-2026-09`, augmente de 585
      # cartes. Les 1 010 deja en ligne gardent leur statut, leurs visuels,
      # leurs favoris et — c'est le point delicat — LEUR ADRESSE : le slug
      # public ne figure pas dans la clause de mise a jour du lot, parce
      # qu'une regle de fabrication qui s'ameliore ne doit jamais reecrire
      # l'adresse d'une page deja partagee.
      #
      # Les 585 nouvelles arrivent en brouillon, dans leur collection et
      # avec leurs tags. Elles ne deviennent visibles que sur le mot
      # « basculer » : installer un catalogue et le montrer sont deux
      # decisions, et la seconde se voit par tout le monde.
      #
      # Aucune URL de visuel dans le fichier d'import : la regle du
      # referentiel est explicite — conserver les medias existants quand
      # les nouvelles URL sont vides. Rien de ce qui a ete depose ne bouge.
      #
      # Rejouable : upserts sur `card_id`, verifie sur une base montee de
      # zero puis rejouee deux fois.
      - name: Installer le catalogue final (1 595 cartes)
        if: inputs.dossier == 'catalogue-final'
        env:
          PGURL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          total=$(ls supabase/seed/catalogue-final/*.sql | grep -vc '900_publication.sql')
          n=0
          for fichier in supabase/seed/catalogue-final/*.sql; do
            # La publication est un geste a part : elle attend « basculer ».
            case "$fichier" in *900_publication.sql) continue;; esac
            n=$((n + 1))
            printf '  [%3d/%3d] %s\n' "$n" "$total" "$(basename "$fichier")"
            psql "$PGURL" -v ON_ERROR_STOP=1 -q --no-psqlrc < "$fichier"
          done
          echo '  Etat du catalogue :'
          psql "$PGURL" -At -c "
            select '    ' || count(*) || ' carte(s), dont ' ||
                   count(*) filter (where status = 'published') || ' en ligne et ' ||
                   count(*) filter (where status = 'draft') || ' en brouillon'
            from public.prompts where external_ref like 'V2-%';"

      - name: Publier les cartes du catalogue final
        if: inputs.dossier == 'catalogue-final' && inputs.bascule == 'basculer'
        env:
          PGURL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          psql "$PGURL" -v ON_ERROR_STOP=1 --no-psqlrc \
            < supabase/seed/catalogue-final/900_publication.sql
          echo '  Rayons apres publication :'
          psql "$PGURL" -At -c "
            select '    Images : ' || jsonb_array_length(public.collections_de_bibliotheque('images')) ||
                   ' collection(s), ' || jsonb_array_length(public.tags_de_bibliotheque('images')) || ' tag(s)';"
          psql "$PGURL" -At -c "
            select '    Textes : ' || jsonb_array_length(public.collections_de_bibliotheque('textes')) ||
                   ' collection(s), ' || jsonb_array_length(public.tags_de_bibliotheque('textes')) || ' tag(s)';"
          psql "$PGURL" -At -c "
            select '    Reflexions : ' || jsonb_array_length(public.collections_de_bibliotheque('reflexions')) ||
                   ' collection(s), ' || jsonb_array_length(public.tags_de_bibliotheque('reflexions')) || ' tag(s)';"

      # lecteur. Rejouable : `create or replace` seul.
      #
      # Trois migrations, dans l'ordre : les sommaires de bibliotheque, les
      # visuels tournants, puis les collections epinglables et la
      # description rendue par les sommaires. Elles vont ensemble — c'est la
      # meme grille qu'elles achevent — et aucune ne touche a une donnee.
      - name: Installer l'exploration par bibliotheque (V4)
        if: inputs.dossier == 'exploration-v4'
        env:
          PGURL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          echo '  Migration : collections_de_bibliotheque / tags_de_bibliotheque'
          psql "$PGURL" -v ON_ERROR_STOP=1 -q --no-psqlrc \
            < supabase/migrations/20260921090000_exploration_par_bibliotheque.sql
          echo '  Sommaires :'
          psql "$PGURL" -At -c "
            select '    Images : ' || jsonb_array_length(public.collections_de_bibliotheque('images')) ||
                   ' collection(s), ' || jsonb_array_length(public.tags_de_bibliotheque('images')) || ' tag(s)';"
          psql "$PGURL" -At -c "
            select '    Textes : ' || jsonb_array_length(public.collections_de_bibliotheque('textes')) ||
                   ' collection(s), ' || jsonb_array_length(public.tags_de_bibliotheque('textes')) || ' tag(s)';"
          psql "$PGURL" -At -c "
            select '    Reflexions : ' || jsonb_array_length(public.collections_de_bibliotheque('reflexions')) ||
                   ' collection(s), ' || jsonb_array_length(public.tags_de_bibliotheque('reflexions')) || ' tag(s)';"
          echo '  Migration : visuels_tournants / tag_favorites'
          psql "$PGURL" -v ON_ERROR_STOP=1 -q --no-psqlrc \
            < supabase/migrations/20260921140000_visuels_tournants_et_tags_favoris.sql
          echo '  Cartes de rayon illustrees :'
          psql "$PGURL" -At -c "
            select '    ' || count(*) || ' rayon(s) recoivent un visuel tire de leur dossier'
            from jsonb_object_keys(public.visuels_tournants(0));"
          # La troisieme de la serie, et la seule qui n'avait pas de pas.
          #
          # Elle etait citee nulle part dans ce fichier : elle n'avait donc
          # aucun chemin vers la production, et elle y manque encore alors
          # que les deux precedentes sont posees depuis longtemps. Deux
          # consequences visibles, et chacune se lit comme un defaut :
          #
          #   * l'etoile posee sur une collection ne fait rien. La lecture
          #     de `category_favorites` echoue, l'ecran avale l'erreur et
          #     rend une liste vide — le geste echoue donc en silence,
          #     alors que la meme etoile fonctionne sur un tag ;
          #
          #   * les rayons de Textes ne montrent toujours qu'un nom. Les
          #     trente descriptions du lot `formats-et-rayons` SONT en base
          #     — quarante-deux tags en portent une — mais aucune des
          #     quatre fonctions de sommaire ne les rend. Elles sont
          #     ecrites et jamais lues.
          #
          # Rejouable : `create table if not exists`, `create or replace`
          # sur des fonctions dont aucune signature ne change — une cle
          # s'ajoute au JSON rendu, et une cle inconnue est ignoree par un
          # lecteur qui ne l'attend pas encore. Le deploiement peut donc se
          # faire dans n'importe quel ordre sans qu'un ecran casse
          # entre-temps.
          echo '  Migration : category_favorites / description des rayons'
          psql "$PGURL" -v ON_ERROR_STOP=1 -q --no-psqlrc \
            < supabase/migrations/20260921160000_rayons_favoris_et_descriptions.sql
          # Les deux controles que la migration appelle. Un `create or
          # replace` qui n'aurait pas pris ne leve pas : il faut regarder
          # ce que la fonction rend, pas le fait qu'elle existe.
          echo '  Collections epinglables :'
          psql "$PGURL" -At -c "
            select '    category_favorites : ' ||
                   count(*) || ' table, RLS ' ||
                   coalesce((select case when c.relrowsecurity then 'active' else 'INACTIVE' end
                             from pg_class c join pg_namespace n on n.oid = c.relnamespace
                             where n.nspname = 'public' and c.relname = 'category_favorites'), 'absente')
            from information_schema.tables
            where table_schema = 'public' and table_name = 'category_favorites';"
          echo '  Ce que contient chaque rayon :'
          psql "$PGURL" -At -c "
            select '    ' || count(*) || ' sommaire(s) sur 4 rendent la description'
            from pg_proc p join pg_namespace n on n.oid = p.pronamespace
            where n.nspname = 'public'
              and p.proname in ('tags_explorables', 'tags_de_bibliotheque',
                                'collections_populaires', 'collections_de_bibliotheque')
              and pg_get_function_result(p.oid) like '%jsonb%'
              and pg_get_functiondef(p.oid) like '%as description%';"
          psql "$PGURL" -At -c "
            select '    ' || count(*) filter (where coalesce(btrim(description), '') <> '') ||
                   ' rayon(s) decrit(s) sur ' || count(*)
            from public.tags where is_active;"

      # Le prix affiche.
      #
      # Un lot de configuration : il ne touche ni au catalogue ni aux
      # visuels, et `upsert_config` ecrase la valeur sans doublon. La
      # periode voyage avec le montant — annoncer un tarif annuel sous une
      # mention « une fois » serait un engagement qu'on ne tient pas.
      - name: Mettre a jour l'offre
        if: inputs.dossier == 'offre-2026-09'
        env:
          PGURL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          for fichier in supabase/seed/offre-2026-09/*.sql; do
            echo "  $(basename "$fichier")"
            psql "$PGURL" -v ON_ERROR_STOP=1 -q --no-psqlrc < "$fichier"
          done
          psql "$PGURL" -At -c "
            select '    Offre : ' ||
                   (select value #>> '{}' from public.app_config where key = 'price_current') ||
                   ' ' || (select value #>> '{}' from public.app_config where key = 'price_currency') ||
                   ' ' || (select value #>> '{}' from public.app_config where key = 'price_period');"

      # La fusion des deux catalogues, et la mise en ligne.
      #
      # A lancer APRES `catalogue-2026-09`, jamais avant : elle deplace les
      # commandes existantes vers des collections que l'import vient de
      # creer.
      #
      # Elle fait quatre choses, dans cet ordre :
      #   1. les 484 commandes image deja en ligne rejoignent les nouvelles
      #      collections, avec leurs visuels, leurs favoris et leurs
      #      identifiants — rien n'est recree, tout est deplace ;
      #   2. les Modes IA, les Parcours guides et les rayons d'essai sont
      #      archives : la bibliotheque Reflexions les remplace ;
      #   3. les 1 010 cartes V2 passent en ligne ;
      #   4. les anciens rayons vides ferment.
      #
      # ARCHIVER, PAS SUPPRIMER : une commande archivee garde sa ligne, son
      # identifiant, ses visuels et son historique, et se rouvre d'un geste.
      # Aucun visuel n'est touche.
      #
      # C'est le lot qui change ce que les membres voient : il demande donc
      # le mot « basculer ».
      - name: Fusionner les catalogues et publier
        if: inputs.dossier == 'fusion-2026-09'
        env:
          PGURL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          if [ "${{ inputs.bascule }}" != "basculer" ]; then
            echo 'Ce lot change la navigation des membres. Taper "basculer" pour confirmer.'
            exit 1
          fi
          for fichier in supabase/seed/fusion-2026-09/*.sql; do
            echo "  $(basename "$fichier")"
            psql "$PGURL" -v ON_ERROR_STOP=1 -q --no-psqlrc < "$fichier"
          done
          echo '  Etat du catalogue :'
          psql "$PGURL" -At -c "
            select '    ' || count(*) filter (where status = 'published') || ' commande(s) publiee(s), ' ||
                   count(*) filter (where status = 'published' and media_ready) || ' avec un visuel'
            from public.prompts;"
          psql "$PGURL" -At -c "
            select '    visuels conserves : ' || count(*) from public.prompt_media;"
          psql "$PGURL" -At -c "
            select '    ancien(s) rayon(s) encore ouvert(s) : ' || count(*)
            from public.categories
            where status <> 'archived' and external_ref like 'V2-%';"

      # Le catalogue de septembre 2026 : la taxonomie V2 de la bibliotheque.
      #
      # 1 010 cartes pour 429 commandes, rangees en 73 collections et 27
      # categories, avec leurs payloads, leurs tags et leurs champs de fiche.
      # Une commande porte desormais plusieurs cartes : /vintageportrait rend
      # « Annees folles », « Studio 1940 » et « Carte postale 1900 » — trois
      # compositions pour un seul nom a retenir.
      #
      # CE LOT NE PUBLIE RIEN ET N'EFFACE RIEN. Le fichier d'import declare
      # lui-meme ses 1 010 lignes en brouillon, sans visuel et sans media a
      # produire : le catalogue en ligne continue de fonctionner pendant que
      # le nouveau s'installe a cote. Aucun visuel n'est touche — la regle
      # d'import du referentiel est explicite sur ce point.
      #
      # Publier, archiver l'ancien et reaffecter se decident ensuite, en
      # regardant ce que l'import a produit. Le mot « basculer » n'a donc pas
      # de sens ici.
      #
      # Idempotent : les lots s'appuient sur card_id et external_ref, et les
      # rejouer ne cree ni doublon ni version d'historique supplementaire.
      - name: Importer le catalogue de septembre 2026
        if: inputs.dossier == 'catalogue-2026-09'
        env:
          PGURL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          echo '  Migration : plusieurs cartes par commande'
          psql "$PGURL" -v ON_ERROR_STOP=1 -q --no-psqlrc \
            < supabase/migrations/20260920140000_cartes_par_commande.sql
          for fichier in supabase/seed/catalogue-2026-09/*.sql; do
            echo "  $(basename "$fichier")"
            psql "$PGURL" -v ON_ERROR_STOP=1 -q --no-psqlrc < "$fichier"
          done
          echo '  Etat du catalogue :'
          psql "$PGURL" -At -c "
            select '    ' || count(*) || ' carte(s) V2 en ' ||
                   count(*) filter (where status = 'draft') || ' brouillon(s), ' ||
                   count(distinct command_id) || ' commande(s)'
            from public.prompts where external_ref like 'V2-%';"
          psql "$PGURL" -At -c "
            select '    catalogue en ligne inchange : ' || count(*) || ' commande(s) publiee(s)'
            from public.prompts where status = 'published' and external_ref not like 'V2-%';"
          psql "$PGURL" -At -c "
            select '    visuels conserves : ' || count(*) from public.prompt_media;"

      # Ce dont les ecrans V3 ont besoin : l'ordre de Decouvrir et les
      # facettes de l'accueil.
      #
      # `discover_rank` est l'index de pagination du feed Decouvrir. Un rang
      # stable tire de l'identifiant : stable, donc le feed ne repasse jamais
      # deux fois la meme carte entre deux paliers ; tire du hachage, donc les
      # rayons s'entremelent au lieu de defiler par familles de soixante.
      #
      # `filtres_accueil` et `prompts_avec_tous_les_tags` servent le filtre
      # depliant qui remplace la barre de recherche : les quatre facettes deja
      # comptees, et le croisement de plusieurs tags en ET — ce que PostgREST
      # ne sait pas exprimer.
      #
      # `tags_explorables` et `tags_voisins` servent la Bibliotheque, qui
      # s'ouvre desormais sur les tags : ce qui est reellement porte, et ce
      # qui se croise encore avec la selection en cours.
      #
      # `collections_populaires` sert l'accueil, ou les collections
      # remplacent les categories : une categorie est un tiroir, une
      # collection est une intention de recherche. La meme migration donne
      # aux tuiles de tag le visuel d'une de leurs cartes, faute de quoi la
      # grille reste vide tant que l'administration n'a rien depose.
      #
      # Les deux lisent a travers les politiques du lecteur. Aucune n'est
      # contournee ni assouplie, et rien de ce que les membres voient ne
      # change tant que les ecrans ne sont pas deployes : le mot « basculer »
      # n'a donc pas de sens ici.
      #
      # Idempotentes (`add column if not exists`, `create or replace`) : les
      # rejouer ne coute rien.
      - name: Installer le socle des ecrans V3 (decouverte, filtres)
        if: inputs.dossier == 'ecrans-v3'
        env:
          PGURL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          echo '  Migration : discover_rank'
          psql "$PGURL" -v ON_ERROR_STOP=1 -q --no-psqlrc \
            < supabase/migrations/20260919140000_ordre_de_decouverte.sql
          echo '  Migration : filtres_accueil / prompts_avec_tous_les_tags'
          psql "$PGURL" -v ON_ERROR_STOP=1 -q --no-psqlrc \
            < supabase/migrations/20260919160000_filtres_accueil.sql
          echo '  Migration : tags_explorables / tags_voisins'
          psql "$PGURL" -v ON_ERROR_STOP=1 -q --no-psqlrc \
            < supabase/migrations/20260919180000_exploration_par_tags.sql
          echo '  Migration : collections_populaires, visuel des tuiles de tag'
          psql "$PGURL" -v ON_ERROR_STOP=1 -q --no-psqlrc \
            < supabase/migrations/20260920160000_accueil_et_tuiles.sql
          echo '  Etat du feed :'
          psql "$PGURL" -At -c "
            select '    ' || count(*) || ' commande(s) publiee(s) avec un visuel apres, ' ||
                   count(*) filter (where p.discover_rank is null) || ' sans rang'
            from public.prompts p
            where p.status = 'published'
              and exists (select 1 from public.prompt_media m
                          where m.prompt_id = p.id and m.kind = 'after');"
          echo '  Facettes du filtre :'
          psql "$PGURL" -At -c "
            select '    ' ||
                   jsonb_array_length(f -> 'bibliotheques') || ' bibliotheque(s), ' ||
                   jsonb_array_length(f -> 'familles') || ' famille(s), ' ||
                   jsonb_array_length(f -> 'tags') || ' tag(s), ' ||
                   jsonb_array_length(f -> 'ias') || ' IA'
            from public.filtres_accueil() as f;"
          echo '  Exploration par tags :'
          psql "$PGURL" -At -c "
            select '    ' || jsonb_array_length(public.tags_explorables()) ||
                   ' tag(s) porte(s) par au moins une commande publiee';"

      # L'administration V3 : suppression definitive controlee.
      #
      # Trois apercus et trois suppressions — commande, rayon, tag — plus la
      # liste des tags telle que l'administration la voit. Chacune verifie
      # `is_admin()` en premiere ligne, journalise l'etat d'avant dans
      # `admin_audit_logs`, et refuse de laisser un orphelin : une commande
      # rend les chemins de ses visuels pour que le stockage soit nettoye, un
      # rayon qui porte encore des commandes exige de dire ou elles vont.
      #
      # Archiver reste le geste par defaut. Ces fonctions ajoutent un geste,
      # elles n'en retirent aucun et n'assouplissent aucune politique. Rien
      # de ce que les membres voient ne change : le mot « basculer » n'a donc
      # pas de sens ici.
      - name: Installer l'administration V3 (suppressions controlees)
        if: inputs.dossier == 'administration-v3'
        env:
          PGURL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          echo '  Migration : apercus et suppressions controlees'
          psql "$PGURL" -v ON_ERROR_STOP=1 -q --no-psqlrc \
            < supabase/migrations/20260920090000_suppression_controlee.sql
          echo '  Fonctions en place :'
          psql "$PGURL" -At -c "
            select '    ' || p.proname
            from pg_proc p join pg_namespace n on n.oid = p.pronamespace
            where n.nspname = 'public'
              and (p.proname like 'admin_supprimer_%'
                or p.proname like 'admin_apercu_%'
                or p.proname = 'admin_liste_tags')
            order by p.proname;"

      # Les actions groupees de l'administration.
      #
      # Une migration seule : deux fonctions qui repetent l'appel unitaire
      # pour chaque identifiant, sans en contourner aucun controle. Rien de ce
      # que les membres voient ne change tant que personne ne s'en sert — le
      # mot « basculer » n'a donc pas de sens ici.
      #
      # Elle est idempotente (`create or replace`), la rejouer ne coute rien.
      - name: Installer les actions groupees (administration)
        if: inputs.dossier == 'actions-groupees'
        env:
          PGURL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          echo '  Migration : admin_set_prompts_status / admin_set_prompts_free'
          psql "$PGURL" -v ON_ERROR_STOP=1 -q --no-psqlrc \
            < supabase/migrations/20260918100000_actions_groupees_admin.sql
          echo '  Fonctions en place :'
          psql "$PGURL" -At -c "
            select '    ' || p.proname
            from pg_proc p join pg_namespace n on n.oid = p.pronamespace
            where n.nspname = 'public' and p.proname like 'admin_set_prompts_%'
            order by p.proname;"

      # Le menage de taxonomie : fermer les rayons que le rangement a vides.
      #
      # Des affectations conditionnelles, jamais une suppression : un rayon
      # archive garde sa ligne, ses relations et son identifiant, et se rouvre
      # d'un geste depuis l'administration. Rien de ce que les membres voient
      # ne change — ces rayons sont deja vides — donc le mot « basculer » n'est
      # pas demande.
      - name: Fermer les rayons vides (menage de taxonomie)
        if: inputs.dossier == 'menage-taxonomie'
        env:
          PGURL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          for fichier in supabase/seed/menage-taxonomie/*.sql; do
            echo "  $(basename "$fichier")"
            psql "$PGURL" -v ON_ERROR_STOP=1 -q --no-psqlrc < "$fichier"
          done
          echo '  Ce que l administration propose au rangement :'
          psql "$PGURL" -At -c "
            select '    ' || count(*) || ' categorie(s)'
            from public.categories c
            where c.status <> 'archived'
               or exists (select 1 from public.prompts p where p.category_id = c.id);"

      - name: Moteur V3 demande sans confirmation
        if: inputs.dossier == 'moteur-v3' && inputs.bascule != 'basculer'
        run: |
          echo "Le moteur V3 change ce que les membres peuvent copier."
          echo "Relancer en tapant « basculer » dans le second champ."
          exit 1

      - name: Refonte V2 demandee sans confirmation
        if: inputs.dossier == 'catalogue-v2' && inputs.bascule != 'basculer'
        run: |
          echo "La refonte V2 remplace le catalogue que les membres voient."
          echo "Relancer en tapant « basculer » dans le second champ."
          exit 1

      - name: Controle final
        env:
          PGURL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          # Les comptes attendus sont verifies par les lots eux-memes. Reste
          # l'invariant qui vaut pour tout catalogue : un raccourci publie
          # dont on ne peut rien copier est un raccourci mort.
          psql "$PGURL" -v ON_ERROR_STOP=1 -At -c "
            do \$\$
            declare
              v_orphelins integer;
              v_categories integer;
            begin
              select count(*) into v_orphelins
              from public.prompts p
              where p.status = 'published'
                and p.external_ref like 'RCI-%'
                and not exists (
                  select 1 from public.prompt_variants v
                  join public.prompt_versions pv on pv.variant_id = v.id and pv.is_current
                  where v.prompt_id = p.id
                );
              if v_orphelins > 0 then
                raise exception '% raccourcis publies sans version copiable.', v_orphelins;
              end if;

              -- Bornee aux familles de la V2 : celles des refontes suivantes
              -- portent elles aussi une reference externe et arrivent par
              -- migration, invisibles. Sans cette borne, le controle final
              -- echouait apres un import deja applique — le pire moment pour
              -- lever. La forme de la reference les separe : « IMG-04 »
              -- appartient a la V2, « IMG-V6-01 » non.
              select count(*) into v_categories
              from public.categories
              where external_ref ~ '^(IMG|TXT)-[0-9]+\$';
              if v_categories <> 13 then
                raise exception 'Attendu 13 familles V2, trouve %.', v_categories;
              end if;
            end \$\$;"

      - name: Etat apres import
        env:
          PGURL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          psql "$PGURL" -At -c "
            select mode || ' : ' || count(*) || ' raccourcis, dont ' ||
                   count(*) filter (where status = 'published') || ' publies, ' ||
                   count(*) filter (where is_free and status = 'published') || ' offerts'
            from public.prompts where external_ref like 'RCI-%'
            group by mode order by mode;"
