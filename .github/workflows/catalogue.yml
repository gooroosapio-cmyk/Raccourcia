name: Catalogue

# Applique le catalogue a une base Supabase, lot par lot, dans l'ordre.
#
# Ce n'est pas un deploiement automatique : le declenchement est manuel et
# demande de taper le nom de la base visee. Un catalogue s'importe quand on
# l'a decide, pas parce qu'une branche a bouge.
#
# Chaque lot porte son controle de completude : le premier qui n'atteint pas
# son compte leve, `ON_ERROR_STOP` arrete la serie, et rien ne passe en
# silence. C'est l'absence de ce controle qui avait laisse 99 raccourcis en
# arriere lors de l'import precedent.
#
# Le dossier de lots est un parametre : un catalogue plus recent n'efface pas
# le precedent, il s'importe a cote et reste rejouable.

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Taper "raccourcia" pour confirmer l import en production'
        required: true
        type: string
      dossier:
        description: 'Lots a appliquer'
        required: true
        default: supabase/seed/catalogue-v3
        type: choice
        options:
          - supabase/seed/catalogue-v3
          - supabase/seed/v3

jobs:
  import:
    name: Importer le catalogue
    runs-on: ubuntu-latest
    # `production` porte le secret et, si l'environnement est protege, une
    # validation humaine avant execution.
    environment: production

    steps:
      - name: Verifier la confirmation
        if: inputs.confirmation != 'raccourcia'
        run: |
          echo "Confirmation absente ou incorrecte : import annule."
          exit 1

      - uses: actions/checkout@v4

      - name: Installer psql
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client

      - name: Verifier que la base est joignable
        env:
          PGURL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          # La connexion directe de Supabase (db.<ref>.supabase.co) ne resout
          # qu'en IPv6. Les runners GitHub n'ont pas d'IPv6 : psql echoue sur
          # un « Network is unreachable » qui ne dit pas pourquoi. On le dit.
          if [ -z "${PGURL:-}" ]; then
            echo "Le secret SUPABASE_DB_URL est vide ou absent de l environnement production."
            exit 1
          fi
          if printf '%s' "$PGURL" | grep -q '@db\..*\.supabase\.co'; then
            echo "L URI pointe vers la connexion directe (db.<ref>.supabase.co), joignable"
            echo "en IPv6 uniquement. Les runners GitHub n ont pas d IPv6."
            echo
            echo "Remplacer le secret SUPABASE_DB_URL par l URI « Session pooler »,"
            echo "affichee dans Supabase > bouton Connect. Elle est en IPv4 et son"
            echo "hote se termine par .pooler.supabase.com."
            exit 1
          fi
          psql "$PGURL" -At -c 'select 1' > /dev/null
          echo "Base joignable."

      - name: Etat avant import
        env:
          PGURL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          psql "$PGURL" -At -c "
            select 'raccourcis=' || count(*) ||
                   ' publies=' || count(*) filter (where status = 'published')
            from public.prompts;"

      - name: Appliquer les lots
        env:
          PGURL: ${{ secrets.SUPABASE_DB_URL }}
          DOSSIER: ${{ inputs.dossier }}
        run: |
          set -euo pipefail
          total=$(ls "$DOSSIER"/*.sql | wc -l)
          n=0
          for fichier in "$DOSSIER"/*.sql; do
            n=$((n + 1))
            printf '  [%3d/%3d] %s\n' "$n" "$total" "$(basename "$fichier")"
            # Redirection plutot que -f : psql lit alors le fichier avec les
            # droits de l'appelant, pas ceux du compte postgres.
            psql "$PGURL" -v ON_ERROR_STOP=1 -q --no-psqlrc < "$fichier"
          done
          if [ "$DOSSIER" = "supabase/seed/v3" ]; then
            echo '  Bascule de navigation'
            psql "$PGURL" -v ON_ERROR_STOP=1 --no-psqlrc \
              < supabase/seed/bascule-navigation-v2.sql
          fi

      - name: Controle final
        env:
          PGURL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          # Les comptes attendus sont verifies par les lots eux-memes. Reste
          # l'invariant qui vaut pour tout catalogue : un raccourci publie
          # dont on ne peut rien copier est un raccourci mort.
          psql "$PGURL" -v ON_ERROR_STOP=1 -At -c "
            do \$\$
            declare
              v_orphelins integer;
              v_categories integer;
            begin
              select count(*) into v_orphelins
              from public.prompts p
              where p.status = 'published'
                and p.external_ref like 'RCI-%'
                and not exists (
                  select 1 from public.prompt_variants v
                  join public.prompt_versions pv on pv.variant_id = v.id and pv.is_current
                  where v.prompt_id = p.id
                );
              if v_orphelins > 0 then
                raise exception '% raccourcis publies sans version copiable.', v_orphelins;
              end if;

              select count(*) into v_categories
              from public.categories where external_ref is not null;
              if v_categories <> 13 then
                raise exception 'Attendu 13 familles, trouve %.', v_categories;
              end if;
            end \$\$;"

      - name: Etat apres import
        env:
          PGURL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          psql "$PGURL" -At -c "
            select mode || ' : ' || count(*) || ' raccourcis, dont ' ||
                   count(*) filter (where status = 'published') || ' publies, ' ||
                   count(*) filter (where is_free and status = 'published') || ' offerts'
            from public.prompts where external_ref like 'RCI-%'
            group by mode order by mode;"
